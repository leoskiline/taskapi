# `helm test` roda este pod sob demanda e considera o release saudável se ele
# sair com código 0. É a diferença entre "o Helm aplicou os manifestos" e "a
# aplicação realmente funciona" — a mesma distinção que o job smoke faz no CI.
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "taskapi.fullname" . }}-test"
  labels:
    {{- include "taskapi.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Apaga o pod antes de rodar de novo, senão o segundo `helm test` falha
    # reclamando que o pod já existe.
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.11.1
      args:
        - /bin/sh
        - -c
        - |
          set -eu
          HOST="http://{{ include "taskapi.fullname" . }}:{{ .Values.service.port }}"
          echo "readiness (exige o banco de pé):"
          curl -fsS -m 10 "$HOST/readyz"
          echo ""
          echo "criando uma tarefa:"
          curl -fsS -m 10 -X POST "$HOST/tasks" -d '{"title":"helm test"}'
          echo ""
          echo "e lendo de volta:"
          curl -fsS -m 10 "$HOST/tasks" | grep -q "helm test"
          echo "OK"
